name: m1-003p-real-sf3d-space

on:
  push:
    branches:
      - feat/m1-003p-trellis2-provider
    paths:
      - scripts/m1_003p_space_benchmark.py
      - .github/workflows/m1-003p-real-sf3d-space.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Space client
        run: python -m pip install "gradio_client==1.3.0" "Pillow>=10,<12" "requests>=2.32,<3"
      - name: Run two real SF3D generations
        run: python scripts/m1_003p_space_benchmark.py
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-003p-real-sf3d-space
          path: benchmark-output/
          if-no-files-found: warn
          retention-days: 7
