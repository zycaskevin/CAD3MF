name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m0-golden-path:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/cad-ir/src:${{ github.workspace }}/packages/cad-compiler/src:${{ github.workspace }}/services/cad-worker/src:${{ github.workspace }}/adapters/cadquery/src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python lint
        run: |
          ruff format . --check
          ruff check .

      - name: Geometry tests
        run: pytest -q

      - name: Build golden artifacts
        run: |
          python -m cad3mf_worker.cli build tests/golden-models/magnet_module.v1.json --out dist/magnet-v1
          python -m cad3mf_worker.cli build tests/golden-models/magnet_module.v2.json --out dist/magnet-v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install widget dependencies
        working-directory: apps/chatgpt-plugin
        run: npm install --no-audit --no-fund

      - name: Build and check ChatGPT widget
        working-directory: apps/chatgpt-plugin
        run: |
          npm run build
          npm run check

      - name: Install MCP dependencies
        working-directory: services/mcp-server
        run: npm install --no-audit --no-fund

      - name: MCP typecheck
        working-directory: services/mcp-server
        run: npm run typecheck

      - name: MCP stdio E2E
        working-directory: services/mcp-server
        env:
          CAD3MF_PYTHON: python
        run: npm test

      - name: MCP HTTP + ChatGPT App E2E
        working-directory: services/mcp-server
        env:
          CAD3MF_PYTHON: python
        run: npm run test:http

      - name: Upload golden artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cad3mf-m0-golden
          path: dist/
          if-no-files-found: error

      - name: Upload ChatGPT widget
        uses: actions/upload-artifact@v4
        with:
          name: cad3mf-chatgpt-widget
          path: apps/chatgpt-plugin/dist/caddesk-viewer.html
          if-no-files-found: error
