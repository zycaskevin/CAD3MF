name: m1-004-robust-repair

on:
  pull_request:

jobs:
  robust-repair-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/mesh-worker/requirements-robust-repair.txt

      - name: Install robust repair runtime
        run: |
          python -m pip install -r services/mesh-worker/requirements-robust-repair.txt
          python -m pip install pytest==8.4.2 jsonschema==4.26.0

      - name: Run M1-004-002 contract tests
        run: pytest -q tests/test_m1_004_002_robust_repair.py

      - name: Run real point-cloud-utils reconstruction
        run: pytest -q tests/test_m1_004_002_pcu_integration.py
